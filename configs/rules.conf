
windowrule {
  name = windowrule-1
  opacity = 0.90 0.80
  match:class = (.*)
}


windowrule {
  name = windowrule-2
  float = on
  match:class = ^([RrWw]ofi)
}

windowrule {
  name = windowrule-3
  float = on
  idle_inhibit = focus
  match:class = ^(mpv)
}

windowrule {
  name = windowrule-4
  float = on
  match:class = ^(eog)$
}

windowrule {
  name = windowrule-5
  float = on
  match:class = ^(qt5ct)$
}

windowrule {
  name = windowrule-6
  float = on
  match:class = ^(qt6ct)$
}

windowrule {
  name = windowrule-7
  float = on
  match:title = ^(DevTools)$
}

windowrule {
  name = windowrule-8
  float = on
  match:class = ^(waypaper)$
}

windowrule {
  name = windowrule-9
  float = on
  match:class = ^(nwg-look)$
}

windowrule {
  name = windowrule-10
  float = on
  match:class = ^(nm-applet)$
}

windowrule {
  name = windowrule-11
  float = on
  match:class = ^(org.kde.ark)$
}

windowrule {
  name = windowrule-12
  float = on
  match:class = ^(kvantummanager)$
}

windowrule {
  name = windowrule-13
  float = on
  match:class = ^(blueman-manager)$
}

windowrule {
  name = windowrule-14
  float = on
  match:class = ^(org.gnome.Calendar)$
}

windowrule {
  name = windowrule-15
  float = on
  match:class = ^(nm-connection-editor)$
}

windowrule {
  name = windowrule-16
  float = on
  match:class = ^(xdg-desktop-portal-gtk)$
}

windowrule {
  name = windowrule-17
  float = on
  match:class = ^(org.pulseaudio.pavucontrol)$
}

windowrule {
  name = windowrule-18
  float = on
  match:class = ^(kitty)$
  match:title = ^(top|btop|htop)$
}

windowrule {
  name = windowrule-19
  float = on
  match:class = ^(org.kde.polkit-kde-authentication-agent-1)$
}



windowrule {
  name = windowrule-20
  no_shadow = on
  match:float = 0
}

windowrule {
  name = windowrule-21
  border_color = $primary
  match:pin = 1
}

windowrule {
  name = windowrule-22
  idle_inhibit = fullscreen
  match:fullscreen = 1
}


windowrule {
  name = windowrule-23
  pin = on
  float = on
  size = (monitor_w*0.25)
  move = ((monitor_w*0.73)) ((monitor_h*0.72))
  keep_aspect_ratio = on
  match:title = ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
}


windowrule {
  name = windowrule-24
  no_anim = on
  no_blur = on
  max_size = 1 1
  no_initial_focus = on
  opacity = 0.0 override 0.0 override
  match:class = ^(xwaylandvideobridge)$
}


windowrule {
  name = windowrule-25
  animation = overshot
  match:class = ^([Rr]ofi)$
}





